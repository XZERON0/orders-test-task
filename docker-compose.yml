services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      # 5433, чтобы не конфликтовать с локальным Postgres, если он уже стоит
      - "5433:5432"
    volumes:
      - orders-db:/var/lib/postgresql/data

volumes:
  orders-db:
